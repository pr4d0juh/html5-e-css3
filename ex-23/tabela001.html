<!DOCTYPE html>
<html lang="pt-BR"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, sans-serif;
        }

        table{
            width: 400px;
            border-collapse: collapse; /*remove os espaos entre bordas*/
        }

        tr.linha{
            background-color: #6d3131; /*cor de fundo para as linhas*/
        }

        td{
            border: 1px solid black;
            padding: 8px;
        }
    </style>
</head>
<body>
   <h1>Exemplo de Tabela</h1>
   <table>
    <tr class="linha"> <!-- Linha 1 -->
        <td>A1</td>
        <td>B1</td>
        <td>C1</td>
    </tr>
    <tr> <!-- Linha 2 -->
        <td>A2</td>
        <td>B2</td>
        <td>C2</td>
    </tr>
    <tr> <!-- Linha 3 -->
        <td>A3</td>
        <td>B3</td>
        <td>C3</td>
    </tr>
    <tr> <!-- Linha 4 -->
        <td>A4</td>
        <td>B4</td>
        <td>C4</td>
    </tr>
   </table>
</body>
</html>
